# Builds nvim-winui-gui: a WinUI 3 (Windows App SDK) app that hosts nvim over msgpack-RPC.
#
# This is deliberately NOT the stock ".NET Core Desktop" template that ships with a fresh
# Windows desktop repo. That one packages an MSIX and expects a signing certificate, neither of
# which applies here: src/App/NvimWinUIGui.csproj sets WindowsPackageType=None, so the app is
# unpackaged, self-contained (WindowsAppSDKSelfContained), and pinned to win-x64. There is no
# MSIX to package and nothing to sign, so the workflow builds the project, smoke-tests it against
# a real Neovim, and uploads the publish output.
#
# The build does not need Visual Studio, matching how the app is developed locally: the project
# is pure C# with no XAML markup, so the Windows App SDK's in-proc MarkupCompilePass2 is used and
# setup-msbuild is not required.

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The app spawns nvim --headless; keep a predictable config for the smoke test.
  NVIM_WINUI_ARGS: -u NONE

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # net8.0-windows10.0.22621.0 needs the Windows App SDK 2.x runtime, which
    # setup-dotnet installs alongside the .NET SDK.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # NvimCore has no package references, so it restores on its own; the app pulls
    # Microsoft.WindowsAppSDK and Microsoft.Graphics.Win2D. Restore the app directly rather than
    # the solution: NvimWinUISolution.sln also references tools/rpc-test, which is a diagnostic
    # harness (see the smoke-test job) and not part of the shipping build.
    - name: Restore
      run: dotnet restore src/App/NvimWinUIGui.csproj

    # The smoke test below attaches the app to a real Neovim, so nvim has to exist first.
    # windows-2022 does not ship it (checked the runner image's installed-software list).
    #
    # Version is pinned to 0.12.5 — the release the ext_linegrid/ext_multigrid handling is written
    # and verified against — because the chocolatey default moves and 0.12.6-beta is currently
    # listed, so an unpinned install could silently start testing a build nobody verified.
    #
    # /NeovimOnPathForAll is explicit because the package does not add nvim to PATH by default, and
    # the app resolves nvim from PATH unless NVIM_WINUI_NVIM is set. Without it the smoke test
    # would fail on `Get-Command nvim` for a reason that has nothing to do with the app.
    - name: Install Neovim
      run: |
        $ErrorActionPreference = 'Stop'
        choco install neovim --version=0.12.5 --params '"/NeovimOnPathForAll"' `
          --yes --no-progress --limit-output
        if ($LASTEXITCODE -ne 0) { throw "choco install neovim failed with $LASTEXITCODE" }
        # choco updates the machine PATH, but this step's shell already inherited the old one, so
        # refresh it or the next step cannot see nvim.
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                    [System.Environment]::GetEnvironmentVariable('Path', 'User')
        $v = nvim --version | Select-Object -First 1
        Write-Host "installed: $v"
        if ($v -notmatch '0\.12\.') { throw "expected Neovim 0.12.x, got: $v" }

    # --no-incremental so a cached obj/ from the restore step can never produce a build that
    # silently skipped recompiling a changed source file.
    - name: Build
      run: >
        dotnet build src/App/NvimWinUIGui.csproj
        --configuration ${{ matrix.configuration }}
        --no-restore
        --no-incremental
      env:
        Configuration: ${{ matrix.configuration }}

    # Prove the app actually attaches to a real Neovim and renders, rather than only compiling.
    # Requires nvim on the runner image; a failure here means the RPC/UI path is broken.
    - name: Smoke test against a live Neovim
      run: |
        $ErrorActionPreference = 'Stop'
        $exe = "src/App/bin/x64/${{ matrix.configuration }}/net8.0-windows10.0.22621.0/win-x64/NvimWinUIGui.exe"
        if (-not (Test-Path $exe)) { throw "build output missing: $exe" }

        $logDir = Join-Path $env:LOCALAPPDATA 'NvimWinUIGui'
        $logFile = Join-Path $logDir 'startup.log'
        Remove-Item -Recurse -Force $logDir -ErrorAction SilentlyContinue

        # NVIM_WINUI_DIAG makes the app log what it did, so the assertions below read it instead
        # of guessing. NVIM_WINUI_SELFTEST is deliberately left off: it types text into the session.
        $env:NVIM_WINUI_DIAG = '1'
        $env:NVIM_WINUI_NVIM = (Get-Command nvim -ErrorAction Stop).Source
        $env:NVIM_WINUI_ARGS = '-u NONE'
        Write-Host "using nvim: $env:NVIM_WINUI_NVIM ($((nvim --version | Select-Object -First 1)))"


        $proc = Start-Process -FilePath $exe -PassThru
        try {
          # Wait for the first flush, not merely for the spawn line. Spawning proves the process
          # started; a flush proves the msgpack-RPC handshake completed, nvim_ui_attach was
          # accepted and the grid came back. Without the flush this check would pass on a build
          # that starts and then fails to talk to nvim, which is the failure that actually happens.
          $deadline = (Get-Date).AddSeconds(90)
          $ok = $false
          $body = ''
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $logFile) {
              $body = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
              if ($body -match 'spawned nvim pid=\d+ port=\d+') {
                $spawn = $Matches[0]
                if ($body -match 'tcp connect OK' -and $body -match 'DISPATCH event=flush') {
                  $ok = $true
                  break
                }
              }
              # Surface a hard failure immediately instead of burning the whole timeout.
              if ($body -match 'CRITICAL|LogCritical|Exception') {
                throw "app reported a critical error during startup:`n$body"
              }
            }
            if ($proc.HasExited) {
              throw "app exited early with code $($proc.ExitCode). Log:`n$(if (Test-Path $logFile) { Get-Content $logFile -Raw })"
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { throw "app did not reach a flushed grid within 90s. Log:`n$body" }

          Write-Host "spawned : $spawn"
          Write-Host "attached: RPC handshake + nvim_ui_attach + first flush OK"
          Write-Host "--- log head ---"
          Get-Content $logFile -TotalCount 25
        }
        finally {
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process nvim -ErrorAction SilentlyContinue | Stop-Process -Force
        }

    # Publish a self-contained win-x64 build so the artifact runs with no .NET runtime and no
    # Windows App SDK package installed. This is the same deployment mode the app uses locally.
    - name: Publish (win-x64, self-contained)
      run: >
        dotnet publish src/App/NvimWinUIGui.csproj
        --configuration ${{ matrix.configuration }}
        --runtime win-x64
        --self-contained true
        --no-restore
        --output publish/${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nvim-winui-gui-${{ matrix.configuration }}-${{ github.sha }}
        path: publish/${{ matrix.configuration }}
        if-no-files-found: error
        retention-days: 14
